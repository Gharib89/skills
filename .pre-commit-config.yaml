# Written by /setup-harness: the edit and commit rungs' linter set. The derived
# skill copies are pinned by skills-lock.json and the catalog-trial fixtures are
# deliberately bad or byte-exact inputs, so neither is linted or rewritten.
exclude: ^(\.claude/skills/|tests/fixtures/)
repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x -s bash -P SCRIPTDIR -S warning
        language: system
        types: [shell]
      # The scripts setup-harness and setup-skills land in a consumer, at
      # shellcheck's default severity, as a consumer's own Shell hook runs them.
      - id: shellcheck-landed
        name: shellcheck (landed scripts)
        entry: shellcheck
        language: system
        files: ^skills/(setup-harness/templates|setup-skills)/[^/]*\.sh$
      - id: actionlint
        name: actionlint
        entry: actionlint -pyflakes=
        language: system
        files: ^\.github/workflows/[^/]+\.ya?ml$
      - id: zizmor
        name: zizmor
        entry: zizmor --offline --fix
        language: system
        files: ^\.github/workflows/[^/]+\.ya?ml$
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: system
        files: ^\.github/workflows/[^/]+\.ya?ml$
