# The vendored media-use skill carries a public PostHog ingest key and OAuth
# client ID. Each exception is limited to its rule, file and value, so other
# secrets remain detectable.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    description = "HeyGen's public PostHog project key in the vendored media-use telemetry"
    condition = "AND"
    paths = ['''(^|/)\.claude/skills/media-use/scripts/lib/telemetry\.mjs$''']
    regexes = ['''^phc_''']

    [[rules.allowlists]]
    description = "HyperFrames public OAuth client ID in the vendored media-use skill"
    condition = "AND"
    paths = ['''(^|/)\.claude/skills/media-use/audio/scripts/lib/heygen\.mjs$''']
    regexes = ['''^Zg3LF4FCLoeJoGs2YqMtZ17g$''']
