<title>{{TITLE}}</title>
<!--
  explainer-video's fixed storyboard page. A session copies it, fills the title above with the
  scene file's title (HTML-escaped), publishes it once with the db, user, comments and assets capabilities,
  and from then on writes board versions to its database; board-data.md is the contract. Nothing
  here is republished per version. `board.mjs build` also embeds one board in storyboard.html, the
  local copy that needs no database.

  Credits: the palette, type, cards and Submit bar follow grill-with-artifact's page, itself
  derived from html-plan's htmlplan.css (claude-community marketplace, MIT, Thariq Shihipar).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
/* Layout: one reading column. Header, the animatic, the brief and sources, one card per scene,
   and a floating Submit bar at the foot. Warm paper, one accent, hairline borders for edges. */
:root {
  --page: #faf9f5; --card: #ffffff; --hover: #f0eee6;
  --fg: #141413; --fg-body: #3d3d3a; --fg-label: #73726c;
  --line: #1f1e1d14; --line-strong: #1f1e1d26;
  --accent: #c6613f; --accent-ink: #ffffff; --accent-wash: #f6e7df; --accent-line: #c6613f66;
  --ok: #2c7a39; --ok-wash: #e2efdf;
  --warn: #946410; --warn-wash: #f4ead2; --danger: #b3261e;
  --r: 12px; --r-sm: 8px; --r-btn: 999px;
  --f-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-serif: ui-serif, Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #262624; --card: #30302e; --hover: #1f1e1d;
    --fg: #faf9f5; --fg-body: #c2c0b6; --fg-label: #9c9a92;
    --line: #dedcd114; --line-strong: #dedcd126;
    --accent: #d97757; --accent-ink: #141413; --accent-wash: #46302a; --accent-line: #d9775780;
    --ok: #6fb37a; --ok-wash: #26372a;
    --warn: #d9a441; --warn-wash: #3d331f; --danger: #e5776e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #262624; --card: #30302e; --hover: #1f1e1d;
  --fg: #faf9f5; --fg-body: #c2c0b6; --fg-label: #9c9a92;
  --line: #dedcd114; --line-strong: #dedcd126;
  --accent: #d97757; --accent-ink: #141413; --accent-wash: #46302a; --accent-line: #d9775780;
  --ok: #6fb37a; --ok-wash: #26372a;
  --warn: #d9a441; --warn-wash: #3d331f; --danger: #e5776e;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { color: var(--fg); font: 430 16px/1.6 var(--f-sans); -webkit-font-smoothing: antialiased; background: var(--page); }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--f-serif); font-weight: 500; }
h1 { font-size: clamp(28px, 4.4vw, 38px); line-height: 1.15; }
h2 { font-size: 24px; line-height: 1.25; }
h3 { font-size: 20px; line-height: 1.3; }
p { margin: 0; max-width: 68ch; }
code { font: .86em var(--f-mono); background: var(--hover); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font: 430 12px/1.4 var(--f-mono); color: var(--fg-label); }
.tag { font: 430 12px/1.5 var(--f-mono); border-radius: 999px; padding: 1px 8px; white-space: nowrap; color: var(--fg-body); background: var(--hover); }
.tag.ok { color: var(--ok); background: var(--ok-wash); }
.tag.accent { color: var(--accent); background: var(--accent-wash); }
.tag.warn { color: var(--warn); background: var(--warn-wash); }

.btn { font: 550 14px/1.2 var(--f-sans); color: var(--fg); background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r-btn); padding: 9px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--fg-label); }
.btn.accent { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.accent:hover:not(:disabled) { filter: brightness(.95); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-sm { padding: 6px 11px; font-size: 14px; }
textarea, input[type="text"] { width: 100%; font: 14px/1.5 var(--f-sans); color: var(--fg); background: var(--page); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 8px 10px; }
textarea { resize: vertical; min-height: 2.6em; }
textarea:focus, input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea:disabled, input:disabled { opacity: .6; }

.panel { background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 24px; padding-block: 40px 32px; display: grid; gap: 28px; }
.hdr { display: grid; gap: 12px; }
.lede { font-size: 16px; line-height: 1.5; color: var(--fg-body); max-width: 62ch; }
.notice { padding: 20px; color: var(--fg-body); }
.banner { padding: 16px 20px; display: grid; gap: 8px; background: var(--warn-wash); border-color: var(--warn); color: var(--fg); }
.banner pre { margin: 0; white-space: pre-wrap; font: 12px/1.5 var(--f-mono); color: var(--fg-body); }
.player, .brief, .sources { padding: 16px 20px; display: grid; gap: 12px; }
.player img, .card img, .card video { display: block; width: 100%; height: auto; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--hover); }
.player audio, .card audio { width: 100%; }
.player .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 10px 14px; }
.knob { display: grid; gap: 4px; }
.src { display: grid; gap: 2px; font-size: 14px; color: var(--fg-body); }
.src b { color: var(--fg); font-weight: 550; }
.cards { display: grid; gap: 16px; }
.card { padding: 16px 20px 20px; display: grid; gap: 12px; min-width: 0; }
.card[data-state="open"], .card[data-state="reopened"] { border-color: var(--accent); }
.card.playing { box-shadow: 0 0 0 3px var(--accent); }
details.card > summary { cursor: pointer; font-weight: 550; }
details.card[open] > summary { margin-bottom: 12px; }
.chead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.chead h3 { flex: 1; min-width: 0; }
.style { font: 430 12px/1.5 var(--f-mono); color: var(--fg-label); overflow-wrap: anywhere; }
.choices { border: 0; margin: 0; padding: 0; display: flex; gap: 16px; flex-wrap: wrap; }
.choices label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-weight: 550; }
.choices input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.field { display: grid; gap: 4px; }
.bar { position: sticky; bottom: 12px; z-index: 5; width: calc(100% - 32px); max-width: 860px; margin: 0 auto 12px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); }
.bar-in { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.count { font-variant-numeric: tabular-nums; color: var(--fg-body); font-size: 14px; }
.count b { color: var(--fg); }
.st { flex-basis: 100%; font-size: 14px; color: var(--fg-body); display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--fg-label); border-radius: var(--r-sm); background: var(--page); }
.st b { color: var(--fg); }
.st-ok { border-left-color: var(--ok); }
.st-warn { border-left-color: var(--warn); }
.st-bad { border-left-color: var(--danger); }
.st pre { margin: 0; white-space: pre-wrap; font: 12px/1.5 var(--f-mono); color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; max-height: 12em; overflow: auto; }
.st-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (max-width: 560px) {
  h2 { font-size: 20px; }
  .wrap { padding-inline: 16px; padding-block: 24px; gap: 24px; }
  .card { padding: 14px 16px 16px; }
}
</style>

<main id="app"></main>

<script type="application/json" id="board">null</script>

<script>
/* ---- core: state in, HTML out. No DOM here, so the page can run headless against board-data.md. ---- */
const CARD_TAG = { open: ['Open', 'accent'], approved: ['Approved', 'ok'], reopened: ['Reopened', 'warn'] };

function newState(title) {
  return { title, boards: [], submitted: {}, drafts: {}, status: 'idle', mode: 'loading', canEdit: true, local: false, playing: null };
}
const latest = S => S.boards[S.boards.length - 1];
function newDraft(b) {
  const d = { choices: {}, narr: {}, notes: {}, brief: {} };
  for (const c of b.scenes) { d.choices[c.id] = c.status === 'approved' ? 'approve' : null; d.narr[c.id] = c.narration; d.notes[c.id] = ''; }
  for (const k of b.brief) d.brief[k.knob] = k.value;
  return d;
}
function draftOf(S) {
  const b = latest(S);
  if (!S.drafts[b.version]) S.drafts[b.version] = newDraft(b);
  return S.drafts[b.version];
}
function setBoards(S, docs) {
  const was = latest(S) && latest(S).version;
  S.boards = docs.slice().sort((a, b) => a.version - b.version);
  S.mode = 'ready';
  if (latest(S) && latest(S).version !== was) { S.status = 'idle'; S.playing = null; }
}
function setAnswers(S, docs) { S.submitted = Object.fromEntries(docs.map(d => [d.version, true])); }

const locked = S => { const b = latest(S); return !S.canEdit || b.kind === 'delivered' || ['sending', 'sent', 'saved'].includes(S.status) || !!S.submitted[b.version]; };
// A failed save leaves the comment as the only copy, so it counts as sent only when it held the whole answers.
const outcome = (saved, woke, whole) => woke && (saved || whole) ? 'sent' : saved ? 'saved' : 'neither';
const needs = c => c.status !== 'approved';
const todoN = S => latest(S).scenes.filter(c => needs(c) && !draftOf(S).choices[c.id]).length;
const canSubmit = S => !!latest(S) && !locked(S) && todoN(S) === 0;

const ACT = {
  choose(S, d) { if (!locked(S)) draftOf(S).choices[d.id] = d.choice; },
  field(S, d) { if (!locked(S)) draftOf(S)[d.field === 'note' ? 'notes' : 'narr'][d.id] = d.value; },
  brief(S, d) { if (!locked(S)) draftOf(S).brief[d.knob] = d.value; },
};

// Changed knobs as `knob=value`; a changed list is one `knob=<item>` per item, an emptied one a lone `knob=`.
function briefArgs(S) {
  const b = latest(S), d = draftOf(S), out = [];
  for (const k of b.brief) {
    const v = d.brief[k.knob];
    if (v === k.value) continue;
    if (k.knob === 'must' || k.knob === 'avoid') {
      const items = v.split(';').map(x => x.trim()).filter(Boolean);
      out.push(...(items.length ? items : ['']).map(x => k.knob + '=' + x));
    } else out.push(k.knob + '=' + v.trim());
  }
  return out;
}
function answersDoc(S, at = new Date().toISOString()) {
  const b = latest(S), d = draftOf(S);
  return { version: b.version, submittedAt: at,
    scenes: b.scenes.map(c => ({ id: c.id, choice: d.choices[c.id], note: d.notes[c.id].trim(), narration: d.narr[c.id].trim() && d.narr[c.id] !== c.narration ? d.narr[c.id] : '' })),
    brief: briefArgs(S) };
}
function answersText(S) {
  const n = latest(S).version;
  // Names the database document without claiming the save worked: this text is also the fallback.
  const lines = [`explainer-video: board ${n} answers (database document answers/board-${n})`];
  const doc = answersDoc(S);
  for (const c of doc.scenes) {
    lines.push(`${c.id}: ${c.choice === 'approve' ? 'Approve' : c.choice === 'revise' ? 'Revise' : 'Unanswered'}`);
    if (c.note) lines.push('  note: ' + c.note.replace(/\s*\n\s*/g, ' '));
    if (c.narration) lines.push('  narration:', ...c.narration.split('\n').map(l => '    ' + l));
  }
  for (const a of doc.brief) lines.push('Brief: ' + a);
  return lines.join('\n');
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// A media URL is https, the artifact's own /_blob/, or a path relative to the page; nothing else reaches src.
function mediaUrl(u) {
  const s = String(u == null ? '' : u);
  if (/^https:/i.test(s) || s.startsWith('/_blob/')) return s;
  return /^[a-z][a-z0-9+.-]*:/i.test(s) || s.startsWith('/') ? '' : s;
}

function view(S) {
  const b = latest(S);
  if (S.mode === 'nodb') return shell(S, 'This page cannot reach its database here, so no board can load. Say so in the terminal, and the session carries on there.');
  if (!b) return shell(S, S.mode === 'loading' ? 'Loading the storyboard.' : 'Waiting for board 1. Claude posts it here in a moment.');
  const delivered = b.kind === 'delivered';
  const lede = delivered ? 'The video is made. Each card plays its own stretch of it; nothing is left to answer.'
    : 'Check each scene: approve it or revise it, edit its narration right on the card, and change the brief if the whole video should differ. Then submit.';
  return `<div class="wrap">
    <header class="hdr"><span class="label">explainer-video · board ${esc(b.version)}</span><h1>${esc(b.title)}</h1><p class="lede">${lede}</p>
      ${S.canEdit || delivered ? '' : '<p class="label">Only an editor of this page answers its boards.</p>'}</header>
    ${b.banner ? banner(b.banner) : ''}
    ${player(S, b)}
    ${briefPanel(S, b)}
    ${sourcesPanel(b)}
    <section class="cards">${b.scenes.map(c => card(S, b, c)).join('')}</section>
  </div>${delivered ? '' : bar(S, b)}`;
}
function shell(S, text) {
  return `<div class="wrap"><header class="hdr"><span class="label">explainer-video · board</span><h1>${esc(S.title)}</h1></header><p class="notice panel" role="status">${esc(text)}</p></div>`;
}
function banner(x) {
  return `<div class="banner panel" role="alert"><b>${esc(x.text)}</b><pre>${x.gates.map(esc).join('\n')}</pre></div>`;
}
function player(S, b) {
  const on = b.scenes.find(c => c.id === S.playing) || b.scenes[0];
  return `<section class="player panel" id="player"><span class="label">Animatic</span>
    <img id="player-still" alt="" src="${esc(mediaUrl(on && on.still))}">
    <audio id="player-audio" controls></audio>
    <div class="row"><button class="btn btn-sm accent" data-act="play">Play animatic</button><button class="btn btn-sm" data-act="stop">Stop</button>
      <span class="label">Plays each card's narration in order with its still shown.</span></div></section>`;
}
function briefPanel(S, b) {
  const d = draftOf(S), dis = locked(S) ? 'disabled' : '';
  if (!b.brief.length) return '';
  return `<section class="brief panel"><span class="label">Brief</span><div class="knobs">${b.brief.map(k =>
    `<label class="knob"><span class="label">${esc(k.knob)}</span><input type="text" data-brief="${esc(k.knob)}" value="${esc(d.brief[k.knob])}" ${dis}></label>`).join('')}</div></section>`;
}
function sourcesPanel(b) {
  if (!b.sources.length) return '';
  return `<section class="sources panel"><span class="label">Sources</span>${b.sources.map(s =>
    `<div class="src"><span><b>${esc(s.id)}</b> · ${esc(s.kind)} · ${esc(s.title)}</span><span>${esc(s.summary)}</span><span class="label">${esc(s.excerpts)} excerpt${s.excerpts === 1 ? '' : 's'}</span></div>`).join('')}</section>`;
}
function card(S, b, c) {
  const d = draftOf(S), dis = locked(S) ? 'disabled' : '', delivered = b.kind === 'delivered';
  const [tagText, tagClass] = CARD_TAG[c.status] || CARD_TAG.open;
  const radio = (v, label) => `<label><input type="radio" name="c-${esc(c.id)}" value="${v}" data-id="${esc(c.id)}" ${d.choices[c.id] === v ? 'checked' : ''} ${dis}>${label}</label>`;
  const media = delivered && c.clip
    ? `<video controls preload="none" src="${esc(mediaUrl(c.clip))}" poster="${esc(mediaUrl(c.still))}"></video>`
    : `<img alt="Still of scene ${esc(c.id)}" src="${esc(mediaUrl(c.still))}">`;
  const body = `<div class="chead"><h3>${esc(c.title)}</h3>${c.role ? `<span class="tag">${esc(c.role)}</span>` : ''}<span class="tag">${esc(c.seconds)} s</span><span class="tag ${tagClass}" data-tag="${esc(c.id)}">${tagText}</span></div>
    ${media}
    <span class="style">${esc(c.style)}</span>
    <audio controls preload="none" src="${esc(mediaUrl(c.audio))}"></audio>
    ${delivered ? `<p>${esc(c.narration).replace(/\n/g, '<br>')}</p>` : `<label class="field"><span class="label">Narration (edit to reword)</span>
      <textarea rows="4" data-field="narration" data-id="${esc(c.id)}" ${dis}>${esc(d.narr[c.id])}</textarea></label>
    <fieldset class="choices"><legend class="label">Your answer</legend>${radio('approve', 'Approve')}${radio('revise', 'Revise')}</fieldset>
    <label class="field"><span class="label">Note (what to change, optional)</span>
      <textarea rows="2" data-field="note" data-id="${esc(c.id)}" ${dis}>${esc(d.notes[c.id])}</textarea></label>`}`;
  const cls = `card panel${S.playing === c.id ? ' playing' : ''}`;
  return c.status === 'approved' && !delivered
    ? `<details class="${cls}" id="card-${esc(c.id)}" data-card="${esc(c.id)}" data-state="approved"><summary>${esc(c.id)} · ${esc(c.title)} <span class="tag ok">Approved</span></summary>${body}</details>`
    : `<article class="${cls}" id="card-${esc(c.id)}" data-card="${esc(c.id)}" data-state="${esc(c.status)}">${body}</article>`;
}
function bar(S, b) {
  if (!S.canEdit) return '';
  const need = b.scenes.filter(needs).length, left = todoN(S);
  const act = S.local
    ? `<button class="btn accent" data-act="copy" ${left ? 'disabled' : ''}>Copy answers</button>`
    : `<button class="btn accent" id="submit" data-act="submit" ${canSubmit(S) ? '' : 'disabled'}>Submit board ${esc(b.version)}</button>`;
  return `<div class="bar panel"><div class="bar-in">
    <span class="count"><b data-ready>${need - left}</b> of ${need} to answer done · ${b.scenes.length - need} already approved</span>
    <div>${act}</div>${S.local ? localNote(S) : status(S)}</div></div>`;
}
function localNote(S) {
  return `<div class="st"><span>Copy the answers, paste them into the terminal, and Claude reads them.</span>
    <pre id="fallback-text">${esc(answersText(S))}</pre><span class="label" id="copied" role="status"></span></div>`;
}
function status(S) {
  const n = latest(S).version;
  switch (S.status) {
    case 'sending': return '<div class="st" role="status">Saving your answers and waking Claude.</div>';
    case 'sent': return '<div class="st st-ok" role="status"><span><b>Sent to Claude.</b> The next board appears on this page; if it does not, type <code>submitted</code> in the terminal.</span></div>';
    case 'saved': return `<div class="st st-warn" role="alert"><span><b>Saved, but Claude was not woken.</b> Type <code>submitted</code> in the terminal and the session reads your saved answers.</span>
      <div class="st-row"><button class="btn btn-sm" data-act="wake">Try waking it again</button></div></div>`;
    case 'neither': return `<div class="st st-bad" role="alert"><span><b>Your answers were not saved.</b> Copy them and paste them into the terminal.</span>
      <pre id="fallback-text">${esc(answersText(S))}</pre>
      <div class="st-row"><button class="btn btn-sm accent" data-act="copy">Copy answers</button><button class="btn btn-sm" data-act="submit">Try again</button><span class="label" id="copied" role="status"></span></div></div>`;
  }
  if (S.submitted[n]) return `<div class="st st-ok" role="status"><span><b>Submitted.</b> Waiting for board ${esc(n + 1)}. If it does not appear, type <code>submitted</code> in the terminal.</span></div>`;
  return '';
}

/* ---- boot: the browser only. Wires the capabilities, the live boards, drafts, the animatic and Submit. ---- */
if (typeof document !== 'undefined') boot();

async function boot() {
  const S = newState(document.title);
  const app = document.getElementById('app');
  const key = () => 'board-draft-' + latest(S).version;
  const saveDraft = () => { try { localStorage.setItem(key(), JSON.stringify(draftOf(S))); } catch (e) {} };
  function restoreDraft() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(key()) || 'null'); } catch (e) {}
    if (!saved || S.drafts[latest(S).version]) return;
    const d = draftOf(S);
    for (const f of ['choices', 'narr', 'notes', 'brief']) for (const [k, v] of Object.entries(saved[f] || {})) if (k in d[f] && (typeof v === 'string' || v === null)) d[f][k] = v;
  }
  function render() {
    const f = document.activeElement, fid = f && (f.id || null);
    const t = document.createElement('template');
    t.innerHTML = view(S);
    // The player keeps its audio element across renders so a playing animatic is not cut off.
    const old = document.getElementById('player'), fresh = t.content.getElementById('player');
    if (old && fresh) { old.querySelector('#player-still').src = fresh.querySelector('#player-still').getAttribute('src'); fresh.replaceWith(old); }
    app.replaceChildren(t.content);
    const el = fid && document.getElementById(fid);
    if (el) el.focus({ preventScroll: true });
  }
  function refresh() {
    const b = latest(S);
    if (!b) return;
    document.querySelectorAll('[data-ready]').forEach(el => { el.textContent = b.scenes.filter(needs).length - todoN(S); });
    document.querySelectorAll('[data-act="submit"], [data-act="copy"]').forEach(x => { x.disabled = S.local ? todoN(S) > 0 : !canSubmit(S); });
    const ft = document.getElementById('fallback-text');
    if (ft) ft.textContent = answersText(S);
  }
  render();

  // The animatic: each card's narration in order, its still shown and its card ringed.
  const audio = () => document.getElementById('player-audio');
  function stop() { const a = audio(); if (a) a.pause(); S.playing = null; render(); }
  function playFrom(i) {
    const c = latest(S) && latest(S).scenes[i];
    if (!c) { S.playing = null; render(); return; }
    S.playing = c.id; render();
    const a = audio();
    a.src = mediaUrl(c.audio);
    a.onended = () => playFrom(i + 1);
    a.play().catch(() => {});
  }

  const embedded = () => { try { return JSON.parse(document.getElementById('board').textContent); } catch (e) { return null; } };
  function localMode() {
    const doc = embedded();
    if (!doc || typeof doc !== 'object') { S.mode = 'nodb'; render(); return; }
    S.local = true; setBoards(S, [doc]); restoreDraft(); render();
  }
  const use = n => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, comments, user] = await Promise.all([use('db'), use('comments'), use('user')]);
  if (!db) return localMode();
  if (user) S.canEdit = await user.canEdit().catch(() => true);

  db.collection('boards').orderBy('version').onSnapshot(snap => {
    const was = latest(S) && latest(S).version;
    setBoards(S, snap.docs.map(d => d.data()));
    if (latest(S) && latest(S).version !== was) restoreDraft();
    render();
  }, () => { S.mode = 'nodb'; render(); });
  db.collection('answers').onSnapshot(snap => { setAnswers(S, snap.docs.map(d => d.data())); render(); }, () => {});

  // The comment is the doorbell: the one page action that starts a turn in the watching session.
  // It carries the answers too, cut to the 4 KiB a comment holds.
  function capped(text) {
    const enc = new TextEncoder(), tail = `\n[cut to fit: read answers/board-${latest(S).version}]`;
    if (enc.encode(text).length <= 4096) return text;
    let s = text;
    while (enc.encode(s + tail).length > 4096) s = s.slice(0, -64);
    return s + tail;
  }
  async function wake(anchor) {
    if (!comments || !anchor) return false;
    try {
      // `available` means this viewer may send, not that a session is watching: a send with no watch
      // lands and wakes nothing, so the sent receipt still names the typed fallback.
      if (await comments.canSendToClaude() !== 'available') return false;
      await comments.sendToClaude({ anchor, text: capped(answersText(S)) });
      return true;
    } catch (e) { return false; }
  }
  const anchorOf = el => (comments ? comments.anchorFor(el).catch(() => null) : Promise.resolve(null));
  async function submit(btn) {
    if (!canSubmit(S) && S.status !== 'neither') return;
    // Lock before any await, so a second click finds the board locked.
    const doc = answersDoc(S);
    S.status = 'sending'; render();
    const anchor = await anchorOf(document.getElementById(btn.id) || btn);
    const saved = await db.doc('answers/board-' + doc.version).set(doc).then(() => true, () => false);
    const woke = await wake(anchor), text = answersText(S);
    S.status = outcome(saved, woke, capped(text) === text);
    render();
  }
  async function rewake(btn) {
    if (S.status !== 'saved') return;
    S.status = 'sending'; render();
    const anchor = await anchorOf(document.getElementById('submit') || btn);
    S.status = (await wake(anchor)) ? 'sent' : 'saved';
    render();
  }
  function copy() {
    const note = t => { const c = document.getElementById('copied'); if (c) c.textContent = t; };
    const selectIt = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('fallback-text')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); note('Selected: press Ctrl+C or Cmd+C'); };
    try { navigator.clipboard.writeText(answersText(S)).then(() => note('Copied'), selectIt); } catch (e) { selectIt(); }
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    const act = t.dataset.act;
    if (act === 'submit') return submit(t);
    if (act === 'wake') return rewake(t);
    if (act === 'copy') return copy();
    if (act === 'play') return playFrom(0);
    if (act === 'stop') return stop();
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (!t.matches('input[type="radio"][data-id]')) return;
    ACT.choose(S, { id: t.dataset.id, choice: t.value }); saveDraft(); render();
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.field) ACT.field(S, { id: t.dataset.id, field: t.dataset.field, value: t.value });
    else if (t.dataset.brief) ACT.brief(S, { knob: t.dataset.brief, value: t.value });
    else return;
    saveDraft(); refresh();
  });
}
</script>
