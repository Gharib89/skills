<title>Grill Page Directions</title>
<!--
  PROTOTYPE (#435), throwaway. The Column layout (picked from the first round of this prototype) in
  three Glass variants, switchable with the bar at the top (arrow keys, or #gray / #black / #apple in
  the link). Dark by default; light applies only when data-theme="light" is set. Sample data only.
  Nothing is saved or sent: Submit is stubbed, and the bar picks its outcome.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; rounds stack top to bottom, the open round last, a sticky Submit
   bar at the foot. Base tokens below; three Glass variants (gray, black, apple.com) override them. */
:root {
  --page: #080808; --bg: #0b0b0b; --card: #100f0e; --band: #0e0e0d;
  --fg: #f4f3f1; --fg-body: #f4f3f1b8; --fg-muted: #f4f3f199; --fg-label: #f4f3f17a; --fg-faint: #f4f3f14d;
  --line: #ffffff14; --line-strong: #ffffff1f; --input: #ffffff1f; --hover: #ffffff12;
  --accent: #f5c451; --accent-hover: #ffd873; --accent-ink: #191510; --accent-text: #f5c451; --accent-edge: #f5c451;
  --accent-wash: #f5c45112; --accent-panel: #1d1a11; --accent-line: #f5c45159;
  --ok: #5ec386; --ok-wash: #5ec3861a; --ok-line: #5ec38666;
  --park: #b995f6; --park-wash: #b995f61a; --park-line: #b995f666;
  --warn: #e3ad4b; --danger: #ea6a64; --link: #f5c451;
  --p-bg: #f4f3f1; --p-fg: #0b0b0b; --p-edge: #0b0b0b59; --p-shadow: #00000099;
  --r: 9px; --r-card: 12px; --r-btn: 9px;
  --f-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --page: #f1f2f5; --bg: #fbfbfc; --card: #ffffff; --band: #f1f2f5;
  --fg: #14161a; --fg-body: #14161acc; --fg-muted: #14161ab3; --fg-label: #14161a99; --fg-faint: #14161a59;
  --line: #14161a1a; --line-strong: #14161a24; --input: #14161a24; --hover: #14161a0f;
  --accent: #f5c451; --accent-hover: #eab534; --accent-ink: #191510; --accent-text: #8a6400; --accent-edge: #c99a1c;
  --accent-wash: #f5c45126; --accent-panel: #fbf3dc; --accent-line: #c99a1c66;
  --ok: #00884c; --ok-wash: #00884c14; --ok-line: #00884c55;
  --park: #794db6; --park-wash: #794db614; --park-line: #794db655;
  --warn: #ac7300; --danger: #c92f33; --link: #14161a;
  --p-bg: #14161a; --p-fg: #fbfbfc; --p-edge: #fbfbfc59; --p-shadow: #14161a40;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--page); color: var(--fg); font: 16px/1.55 var(--f-sans); -webkit-font-smoothing: antialiased; }

/* ---------- prototype chrome (not part of any direction) ---------- */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100; display: flex; justify-content: center; padding: 8px 16px; pointer-events: none; }
.proto-in { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: center; background: var(--p-bg); color: var(--p-fg); border: 1px dashed var(--p-edge); border-radius: 12px; padding: 6px 10px; font: 500 12px/1.3 var(--f-mono); box-shadow: 0 6px 24px var(--p-shadow); max-width: 100%; }
.proto button, .proto select { font: inherit; color: inherit; background: var(--p-bg); border: 1px solid var(--p-edge); border-radius: 6px; padding: 3px 7px; cursor: pointer; }
.proto label { display: flex; gap: 6px; align-items: center; }
.proto-tag { background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 1px 6px; font-size: 10.5px; letter-spacing: .06em; }
.proto-dir { min-width: 8.5em; text-align: center; }
.proto-panel { pointer-events: auto; position: absolute; top: calc(100% - 2px); left: 50%; transform: translateX(-50%); width: min(680px, calc(100% - 32px)); max-height: 62vh; overflow: auto; background: var(--p-bg); color: var(--p-fg); border: 1px dashed var(--p-edge); border-radius: 12px; padding: 12px 14px; box-shadow: 0 6px 24px var(--p-shadow); }
.proto-panel h4 { margin: 0 0 6px; font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.proto-panel pre { margin: 0 0 14px; font: 12px/1.5 var(--f-mono); white-space: pre-wrap; word-break: break-word; }
body.frame #stage { max-width: 400px; margin-inline: auto; outline: 1px dashed var(--fg-faint); }

/* ---------- shared skin ---------- */
.dir { container-type: inline-size; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--f-sans); }
.dir h1, .dir h2, .dir h3 { margin: 0; text-wrap: balance; font-weight: 700; }
.dir h1 { font-size: 2.5rem; line-height: 1.06; letter-spacing: -.03em; }
.dir h2 { font-size: 1.5rem; line-height: 1.15; letter-spacing: -.022em; }
.dir h3 { font-size: 1.0625rem; line-height: 1.3; letter-spacing: -.01em; }
.dir p { margin: 0; max-width: 68ch; }
@container (max-width: 560px) { .dir h1 { font-size: 2rem; } .dir h2 { font-size: 1.3rem; } }
.label { font: 500 11px/1.4 var(--f-mono); color: var(--fg-label); letter-spacing: .02em; }
.mono { font-family: var(--f-mono); }
.chip { font: 500 11px/1.4 var(--f-mono); border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 6px; color: var(--fg-muted); white-space: nowrap; }
.dir code { font: 500 .86em var(--f-mono); background: var(--hover); border: 1px solid var(--line); border-radius: 4px; padding: .05em .35em; overflow-wrap: anywhere; }
.dir a { color: var(--link); }
.btn { font: 500 14px/1.2 var(--f-sans); color: var(--fg); background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r-btn); padding: 9px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.accent:hover:not(:disabled) { background: var(--accent-hover); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.on { border-color: var(--park); color: var(--park); background: var(--park-wash); }
.btn-sm { padding: 6px 11px; font-size: 13px; }
.btn-lg { padding: 12px 20px; font-size: 15px; }
.btn-link { font: 500 13px var(--f-sans); background: none; border: 0; padding: 0; color: var(--accent-text); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--accent-line); white-space: nowrap; }
.btn-link:disabled { opacity: .4; cursor: not-allowed; }
kbd { font: 500 10px/1.5 var(--f-mono); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--fg-muted); }
.btn.accent kbd { color: inherit; border-color: currentColor; opacity: .6; }
.tag, .qtag { font: 500 11px/1.5 var(--f-mono); border-radius: 4px; padding: 1px 6px; white-space: nowrap; color: var(--fg-muted); background: var(--hover); }
.tag.ok { color: var(--ok); background: var(--ok-wash); }
.tag.accent { color: var(--accent-text); background: var(--accent-wash); }
.tag.park { color: var(--park); background: var(--park-wash); }
.qtag[data-state="ready"] { color: var(--ok); background: var(--ok-wash); }
.qtag[data-state="deferred"] { color: var(--park); background: var(--park-wash); }
.qtag[data-state="incomplete"] { color: var(--warn); background: var(--hover); }
.rec { font: 500 10.5px/1.5 var(--f-mono); color: var(--accent-text); text-transform: uppercase; letter-spacing: .06em; border: 1px solid var(--accent-line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.qid { font: 500 12px var(--f-mono); color: var(--fg-label); }
.how { font: 500 11px var(--f-mono); color: var(--fg-label); white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent-edge); outline-offset: 2px; }
.dir textarea, .dir input[type="text"] { width: 100%; font: 14px/1.5 var(--f-sans); color: var(--fg); background: var(--bg); border: 1px solid var(--input); border-radius: 7px; padding: 8px 10px; }
.dir textarea { resize: vertical; min-height: 2.6em; }
.dir textarea:focus, .dir input[type="text"]:focus { border-color: var(--accent-line); outline: none; box-shadow: 0 0 0 3px var(--accent-wash); }
.dir textarea:disabled, .dir input:disabled { opacity: .6; }
.carried { font-size: 14px; color: var(--fg-body); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.docs { display: grid; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--band); }
.docs ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; color: var(--fg-body); }
.docs-none { font-size: 14px; color: var(--fg-muted); }

/* submit status, shared markup */
.st { flex-basis: 100%; font-size: 14px; color: var(--fg-body); display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--fg-faint); border-radius: 7px; background: var(--bg); }
.st b { color: var(--fg); }
.st-sending { display: flex; align-items: center; gap: 10px; }
.st-ok { border-left-color: var(--ok); }
.st-warn { border-left-color: var(--warn); }
.st-bad { border-left-color: var(--danger); }
.st pre { margin: 0; white-space: pre-wrap; font: 12px/1.5 var(--f-mono); color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 10px; max-height: 12em; overflow: auto; }
.st-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spin { flex: none; width: 12px; height: 12px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.cl-ctl { display: grid; gap: 10px; flex: 1 1 100%; }
.cl-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.cl-note { display: grid; gap: 6px; }

/* figures */
.fig { margin: 0; display: grid; gap: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); padding: 14px; min-width: 0; }
.fig-scroll { overflow-x: auto; }
.fig svg { display: block; width: 100%; min-width: 620px; height: auto; }
.fig figcaption { font-size: 14px; color: var(--fg-muted); max-width: 68ch; }
.dir svg [data-q] { cursor: pointer; }

/* ===== FIGURE STYLE CONTRACT: the only classes Claude-drawn SVGs use; colours come from tokens ===== */
.dir svg { color: var(--fg); }
.dir svg text { font: 12px var(--f-sans); fill: currentColor; }
.dir svg .lbl { font: 500 11px var(--f-mono); fill: var(--fg-label); letter-spacing: .04em; }
.dir svg .n-settled rect { fill: var(--ok-wash); stroke: var(--ok); }
.dir svg .n-open rect { fill: var(--accent-wash); stroke: var(--accent-edge); stroke-width: 1.5; }
.dir svg .n-open text { font-weight: 500; }
.dir svg .n-blocked rect { fill: var(--card); stroke: var(--fg-faint); stroke-dasharray: 4 3; }
.dir svg .n-blocked text { fill: var(--fg-muted); }
.dir svg .n-deferred rect { fill: var(--park-wash); stroke: var(--park); stroke-dasharray: 2 3; }
.dir svg .edge { fill: none; stroke: var(--fg-faint); stroke-width: 1.2; }
.dir svg .edge.hot { stroke: var(--accent-edge); stroke-width: 1.8; }
.dir svg .box rect { fill: var(--card); stroke: var(--fg-faint); }
.dir svg .box.hot rect { fill: var(--accent-wash); stroke: var(--accent-edge); stroke-width: 1.5; }

/* ---------- A · Column ---------- */
.a-wrap { max-width: 860px; margin: 0 auto; padding-inline: 24px; padding-block: 40px 32px; display: grid; gap: 36px; }
.a-hdr { display: grid; gap: 12px; }
.a-hdr .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.a-lede { font-size: 18.5px; line-height: 1.55; color: var(--fg-muted); max-width: 52ch; }
.a-round { display: grid; gap: 16px; }
.a-rhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
.a-rhead .btn-link { margin-left: auto; }
.a-settled { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.a-settled summary { cursor: pointer; padding: 12px 16px; font-weight: 500; font-size: 15px; }
.a-settled ol { margin: 0; padding: 4px 16px 14px; list-style: none; display: grid; gap: 10px; }
.a-settled li { display: grid; grid-template-columns: 3.6rem minmax(0, 1fr) auto; gap: 10px; align-items: baseline; font-size: 15px; color: var(--fg-body); }
.a-settled li b { color: var(--fg); font-weight: 600; }
.a-settled li .how { margin-left: 6px; }
.a-q { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; display: grid; gap: 16px; min-width: 0; }
.a-q[data-state="ready"] { border-color: var(--ok-line); }
.a-q[data-state="deferred"] { border-color: var(--park-line); }
.a-qhead { display: flex; gap: 10px; align-items: baseline; }
.a-qhead h3 { flex: 1; min-width: 0; font-size: 1.25rem; letter-spacing: -.02em; }
.a-opts { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.a-opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: var(--r); cursor: pointer; }
.a-opt:hover { background: var(--hover); }
.a-opt:has(input:checked) { border-color: var(--accent-edge); background: var(--accent-wash); }
.a-opt.a-defer:has(input:checked) { border-color: var(--park); background: var(--park-wash); }
.a-opt input[type="radio"] { margin: 5px 0 0; accent-color: var(--accent); }
.a-opt > span { display: grid; gap: 4px; min-width: 0; }
.a-opt .t { font-weight: 500; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.a-opt .d { color: var(--fg-muted); font-size: 14px; }
.a-why { background: var(--band); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; font-size: 15px; color: var(--fg-body); }
.a-why .label { color: var(--accent-text); }
.a-foot { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
.a-comment { flex: 1 1 16rem; display: grid; gap: 6px; }
.a-summary { display: grid; gap: 8px; padding: 20px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--card); }
.a-summary h3:not(:first-child) { margin-top: 10px; }
.a-summary p { color: var(--fg-body); }
.a-bar { position: sticky; bottom: 0; z-index: 5; background: var(--card); border-top: 1px solid var(--line-strong); padding: 12px 24px calc(12px + env(safe-area-inset-bottom, 0px)); }
.a-bar-in { max-width: 812px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.a-count { font-variant-numeric: tabular-nums; color: var(--fg-muted); font-size: 14px; }
.a-count b { color: var(--fg); }
.a-actions { display: flex; gap: 8px; flex-wrap: wrap; }
@container (max-width: 560px) {
  .a-wrap { padding-inline: 16px; padding-block: 24px; gap: 28px; }
  .a-lede { font-size: 17px; }
  .a-q { padding: 16px; }
  .a-settled li { grid-template-columns: 3.2rem minmax(0, 1fr); }
  .a-settled li > :last-child { grid-column: 2; justify-self: start; }
  .a-bar { padding-inline: 16px; }
}


/* ---------- Glass: frosted panels over a wallpaper; shared by every variant ---------- */
.glass {
  --bg: #10121acc; --card: #1c1f2a8c; --band: #ffffff0d;
  --fg: #f5f5f7; --fg-body: #f5f5f7cc; --fg-muted: #ebebf599; --fg-label: #ebebf580; --fg-faint: #ebebf54d;
  --line: #ffffff1f; --line-strong: #ffffff2e; --input: #ffffff2e; --hover: #ffffff14;
  --accent: #0a84ff; --accent-hover: #409cff; --accent-ink: #ffffff; --accent-text: #64b5ff; --accent-edge: #0a84ff;
  --accent-wash: #0a84ff26; --accent-panel: #0a84ff1f; --accent-line: #0a84ff80;
  --ok: #30d158; --ok-wash: #30d1581f; --ok-line: #30d15873;
  --park: #bf5af2; --park-wash: #bf5af21f; --park-line: #bf5af273;
  --warn: #ff9f0a; --danger: #ff453a; --link: #64b5ff;
  --glass-edge: #ffffff2e; --glass-hi: #ffffff40; --glass-shadow: #0000004d; --bar: var(--card);
  --r: 14px; --r-card: 22px; --r-btn: 999px;
  --f-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  --f-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] .glass {
  --bg: #ffffffb3; --card: #ffffff8c; --band: #ffffff66;
  --fg: #1d1d1f; --fg-body: #1d1d1fcc; --fg-muted: #3c3c43b3; --fg-label: #3c3c4399; --fg-faint: #3c3c4359;
  --line: #0000001a; --line-strong: #00000024; --input: #00000026; --hover: #0000000d;
  --accent: #007aff; --accent-hover: #0a6cff; --accent-ink: #ffffff; --accent-text: #0064d2; --accent-edge: #007aff;
  --accent-wash: #007aff1f; --accent-panel: #007aff14; --accent-line: #007aff66;
  --ok: #248a3d; --ok-wash: #248a3d1a; --ok-line: #248a3d66;
  --park: #8944ab; --park-wash: #8944ab1a; --park-line: #8944ab66;
  --warn: #c93400; --danger: #d70015; --link: #0064d2;
  --glass-edge: #ffffff99; --glass-hi: #ffffffcc; --glass-shadow: #1d1d1f1f;
  color-scheme: light;
}
.glass { background:
  radial-gradient(55% 45% at 12% 8%, var(--wall-a), transparent 70%),
  radial-gradient(50% 40% at 88% 22%, var(--wall-b), transparent 70%),
  radial-gradient(60% 50% at 70% 92%, var(--wall-c), transparent 70%),
  var(--wall-base); background-attachment: fixed; }
.glass .a-q, .glass .a-settled, .glass .a-wrap > .fig, .glass .docs, .glass .a-summary, .glass .a-bar {
  background: var(--card); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--glass-edge); border-radius: var(--r-card);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 10px 40px var(--glass-shadow); }
.glass .docs { border-radius: var(--r); }
.glass .a-q[data-state="ready"] { border-color: var(--ok-line); }
.glass .a-q[data-state="deferred"] { border-color: var(--park-line); }
.glass .a-bar { background: var(--bar); bottom: 12px; width: calc(100% - 32px); max-width: 860px; margin: 0 auto 12px; padding: 12px 18px; }
.glass .a-opt, .glass .a-why, .glass .a-q .fig { background: var(--hover); border-color: var(--glass-edge); }
.glass .a-opt:has(input:checked) { background: var(--accent-wash); border-color: var(--accent-edge); }
.glass .a-opt.a-defer:has(input:checked) { background: var(--park-wash); border-color: var(--park); }
.glass .btn { background: var(--hover); border-color: var(--glass-edge); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.glass .btn.accent { background: var(--accent); border-color: transparent; color: var(--accent-ink); box-shadow: inset 0 1px 0 var(--glass-hi); }
.glass .btn.accent:hover:not(:disabled) { background: var(--accent-hover); }
.glass .tag, .glass .qtag, .glass .rec, .glass .chip { border-radius: 999px; padding-inline: 8px; }
.glass h1 { letter-spacing: -.025em; }
.glass code { background: var(--hover); border-color: var(--glass-edge); border-radius: 6px; }

/* variant 1: Gray wallpaper */
.pal-gray { --page: #111316; --wall-a: #5b616b; --wall-b: #353a42; --wall-c: #6b717b; --wall-base: #16181c; --card: #2a2d338c; }
:root[data-theme="light"] .pal-gray { --page: #e6e8eb; --wall-a: #c9cdd3; --wall-b: #b8bdc5; --wall-c: #dadde2; --wall-base: #eceef1; --card: #ffffff8c; }

/* variant 2: Black, with a faint sheen so the glass still reads */
.pal-black { --page: #000000; --wall-a: #1f1f22; --wall-b: #151517; --wall-c: #232326; --wall-base: #000000; --card: #ffffff0d; --glass-edge: #ffffff21; --glass-hi: #ffffff2e; --glass-shadow: #000000cc;
  --park: #aeaeb2; --park-wash: #aeaeb21a; --park-line: #aeaeb259; --bar: #0a0a0bcc; }
:root[data-theme="light"] .pal-black { --page: #f2f2f4; --wall-a: #e6e6e9; --wall-b: #efeff1; --wall-c: #e2e2e6; --wall-base: #fafafa; --card: #ffffffa6; --glass-edge: #ffffffcc; --glass-hi: #ffffff; --glass-shadow: #0000001a;
  --park: #636366; --park-wash: #6363661a; --park-line: #63636659; --bar: #fafafacc; }

<script>
/* ---------------- sample data (the round-data shape, first cut) ---------------- */
const TOPIC = 'Stale claims in ship';

const TREE = `<svg viewBox="0 0 900 262" role="img" aria-label="Design tree for round 3: three settled answers and one deferred answer feed four open questions. Two decisions stay blocked, and both wait on Q1.">
<text class="lbl" x="20" y="26">SETTLED · BUILT ON</text><text class="lbl" x="340" y="26">OPEN · ROUND 3</text><text class="lbl" x="680" y="26">BLOCKED</text>
<path class="edge" d="M230 62 L340 62"/><path class="edge" d="M230 106 C285 106 285 62 340 62"/><path class="edge" d="M230 150 C285 150 285 112 340 112"/><path class="edge" d="M230 194 C285 194 285 162 340 162"/>
<path class="edge hot" d="M570 62 C625 62 625 76 680 76"/><path class="edge hot" d="M570 62 C625 62 625 156 680 156"/><path class="edge" d="M570 112 C625 112 625 76 680 76"/><path class="edge" d="M570 162 C625 162 625 156 680 156"/>

<g class="n-open" data-q="Q1"><rect x="340" y="46" width="230" height="32" rx="6"/><text x="352" y="66">Q1 · When a claim is stale</text></g>
<g class="n-open" data-q="Q2"><rect x="340" y="96" width="230" height="32" rx="6"/><text x="352" y="116">Q2 · Who may break it</text></g>

<g class="n-blocked"><rect x="680" y="140" width="200" height="32" rx="6"/><text x="692" y="160">Hand-back message</text></g>
<text class="lbl" x="692" y="190">waits on Q1, Q3</text>
</svg>`;
const TREE_CAPTION = 'Q1 has the most riding on it: both blocked decisions wait on it. Q3 is the question you deferred in round 2, and Q4 is the answer you reopened from round 1.';

const FIG_Q1 = `<svg viewBox="0 0 720 178" role="img" aria-label="Two timelines. With a fixed two-hour clock, a live run whose CI queue took 2 hours 10 minutes loses its claim. With two CI rounds and no push, only an idle run loses it.">
<text class="lbl" x="20" y="22">a · FIXED 2 HOURS</text>
<g class="box"><rect x="20" y="34" width="150" height="32" rx="5"/><text x="32" y="54">Claim taken</text></g>
<path class="edge" d="M170 50 L200 50"/>
<g class="box"><rect x="200" y="34" width="150" height="32" rx="5"/><text x="212" y="54">CI queue: 2h 10m</text></g>
<path class="edge" d="M350 50 L380 50"/>
<g class="box"><rect x="380" y="34" width="150" height="32" rx="5"/><text x="392" y="54">Claim broken mid-run</text></g>
<text class="lbl" x="548" y="54">live run loses it</text>
<text class="lbl" x="20" y="106">b · TWO CI ROUNDS, NO PUSH</text>
<g class="box"><rect x="20" y="118" width="150" height="32" rx="5"/><text x="32" y="138">Claim taken</text></g>
<path class="edge" d="M170 134 L200 134"/>
<g class="box"><rect x="200" y="118" width="150" height="32" rx="5"/><text x="212" y="138">Two red rounds</text></g>
<path class="edge hot" d="M350 134 L380 134"/>
<g class="box hot"><rect x="380" y="118" width="150" height="32" rx="5"/><text x="392" y="138">Stale: may be broken</text></g>
<text class="lbl" x="548" y="138">only idle runs lose it</text>
</svg>`;

const PAST = [
  { round: 1, settled: [
      { id: 'R1·Q1', title: 'Claim marker', answer: 'The issue\'s assignee plus a `claim:` comment that names the run.', how: 'rec' },
      { id: 'R1·Q2', title: 'Where the claim comment goes', answer: 'On the issue.', how: 'rec', reopened: 'Q4', replacedBy: 'R3·Q4' },
      { id: 'R1·Q3', title: 'What the comment names', answer: 'The run\'s session URL and the time it started.', how: 'other' },
      { id: 'R1·Q4', title: 'Held claims', answer: '`select` skips any issue whose claim is held.', how: 'rec' } ],
    docsWritten: [ { file: 'GLOSSARY.md', summary: 'New term **Claim**: the marker that says one run owns an issue.' } ] },
  { round: 2, settled: [
      { id: 'R2·Q1', title: 'What stale means', answer: 'No activity from the claiming run, judged by pushes and CI, not by progress.', how: 'rec' },
      { id: 'R2·Q2', title: 'How a claim is broken', answer: 'The breaking run comments first, then takes the assignee.', how: 'yours' },
      { id: 'R2·Q3', title: 'Retry budget', answer: 'Deferred.', how: 'defer', carried: 'Q3', replacedBy: 'R3·Q3' } ],
    docsWritten: [ { file: 'docs/adr/0007-a-stale-claim-is-broken-by-comment.md', summary: 'Drafted: comment first, then take, and why a silent take was rejected.' } ] },
];

const ROUND = { round: 3, kind: 'questions', treeSvg: TREE, treeCaption: TREE_CAPTION, questions: [
  { id: 'Q1', short: 'Stale when', title: 'When does a claim count as stale?', recommended: 'b',
    options: [
      { id: 'a', title: 'After 2 hours with no push', detail: 'A fixed clock, the same in every repo.' },
      { id: 'b', title: 'After two CI rounds with no new commit', detail: 'Tracks the run\'s own pace, so slow CI gets a longer lease.' },
      { id: 'c', title: 'Never on its own', detail: 'Only the human releases a claim, by removing the assignee.' } ],
    why: 'A fixed clock breaks live runs on slow CI, as the figure shows. Two rounds leave room for one flaky retry before another run may take over.',
    figureSvg: FIG_Q1, figureCaption: 'Row a breaks a live run whose CI queue ran long. Row b waits for two red rounds with no new commit, so only an idle run loses its claim.' },
  { id: 'Q2', short: 'Who breaks it', title: 'Who may break a stale claim?', recommended: 'a',
    options: [
      { id: 'a', title: 'Any ship run', detail: 'Attended or unattended, whichever selects the issue next.' },
      { id: 'b', title: 'Only an attended run', detail: 'A human is watching when work changes hands.' },
      { id: 'c', title: 'Only the human', detail: 'By a `claim:release` label. Runs never break claims.' } ],
    why: 'Unattended runs are where claims go stale. If only attended runs may break them, a stale issue stays parked until someone is at the keyboard.' },
  { id: 'Q3', short: 'Retry budget', title: 'How many times may a broken claim be retried?', recommended: 'a',
    carriedFrom: { round: 2, id: 'R2·Q3', reason: 'deferred' },
    options: [
      { id: 'a', title: 'Once, then hand back', detail: 'One fresh run tries. If it goes stale too, the issue goes back to `needs-triage`.' },
      { id: 'b', title: 'Up to three times', detail: 'Each stale run hands to the next, three in a row at most.' },
      { id: 'c', title: 'Never: hand back at once', detail: 'A broken claim means a human looks first.' } ],
    why: 'A second stale run on the same issue usually means the issue is the problem, not the run. One retry still catches a crashed sandbox without looping.' },
  { id: 'Q4', short: 'Comment place', title: 'Where does the claim comment go?', recommended: 'a',
    carriedFrom: { round: 1, id: 'R1·Q2', reason: 'reopened', earlier: 'On the issue.' },
    options: [
      { id: 'a', title: 'On the issue', detail: 'One place for the claim, before and after a PR exists.' },
      { id: 'b', title: 'On the PR once one exists', detail: 'Reviewers see who holds it; the issue comment is edited to point there.' },
      { id: 'c', title: 'On both', detail: 'Two comments to keep in step.' } ],
    why: 'The claim exists before any PR does, and `select` reads issues, not PRs. Moving it later adds a second place to look.' },
] };
const QS = Object.fromEntries(ROUND.questions.map(q => [q.id, q]));

const R3_SETTLED = { round: 3, settled: [
    { id: 'R3·Q1', title: 'When a claim is stale', answer: 'After two CI rounds with no new commit.', how: 'rec' },
    { id: 'R3·Q2', title: 'Who may break it', answer: 'Any ship run.', how: 'rec' },
    { id: 'R3·Q3', title: 'Retry budget', answer: 'Once, then hand back.', how: 'rec' },
    { id: 'R3·Q4', title: 'Where the claim comment goes', answer: 'On the issue, kept after reopening.', how: 'yours' } ],
  docsWritten: [
    { file: 'GLOSSARY.md', summary: 'New term **Stale claim**.' },
    { file: 'docs/adr/0007-a-stale-claim-is-broken-by-comment.md', summary: 'Updated with the two-round threshold and the one-retry budget.' } ] };

const CLOSING = { round: 4, kind: 'closing', summary: [
    { heading: 'What a claim is', text: 'An issue\'s assignee plus a `claim:` comment on the issue, naming the run\'s session URL and start time. `select` skips a held claim.' },
    { heading: 'When it goes stale', text: 'After two CI rounds with no new commit from the claiming run. A slow CI queue alone never makes a claim stale.' },
    { heading: 'Breaking and retrying', text: 'Any ship run may break a stale claim: it comments first, then takes the assignee. One retry is allowed; a second stale run hands the issue back.' } ] };

const HOW = { rec: 'recommendation', yours: 'your pick', other: 'your own answer', defer: 'deferred' };
const DIRS = [ { k: 'gray', name: 'Glass gray' }, { k: 'black', name: 'Glass black' }, { k: 'apple', name: 'apple.com' } ];

/* ---------------- state (in memory only) ---------------- */
let S = { dir: 'gray', scene: 'round', outcome: 'sent' };
function reset() {
  S = { dir: S.dir, scene: S.scene, outcome: S.outcome, submit: 'idle', submittedAt: null,
    answers: Object.fromEntries(ROUND.questions.map(q => [q.id, { choice: null, other: '', comment: '' }])),
    reopen: [], closing: { choice: null, comment: '' } };
}
reset();

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const $ = s => document.querySelector(s);
const ans = id => S.answers[id];
const locked = () => S.submit === 'sending' || S.submit === 'sent';
const dis = () => locked() ? 'disabled' : '';
const optTitle = (q, id) => q.options.find(o => o.id === id)?.title;
function qstate(q) {
  const a = ans(q.id);
  if (!a.choice) return 'empty';
  if (a.choice === 'defer') return 'deferred';
  if (a.choice === 'other' && !a.other.trim()) return 'incomplete';
  return 'ready';
}
const QTAG = { empty: 'Open', incomplete: 'Other needs text', ready: 'Ready', deferred: 'Deferred' };
const readyN = () => ROUND.questions.filter(q => ['ready', 'deferred'].includes(qstate(q))).length;
const allDone = () => readyN() === ROUND.questions.length;
function answerLabel(q) {
  const a = ans(q.id);
  if (!a.choice) return 'Not answered yet';
  if (a.choice === 'defer') return 'Deferred to round 4';
  if (a.choice === 'other') return 'Other: ' + (a.other.trim() || '(no text yet)');
  return a.choice + '. ' + optTitle(q, a.choice);
}
const rounds = () => S.scene === 'closing' ? [...PAST, R3_SETTLED] : PAST;
const active = () => rounds().flatMap(r => r.settled).filter(s => !(S.scene === 'closing' && s.replacedBy));

function answersDoc() {
  if (S.scene === 'closing') return { round: 4, submittedAt: S.submittedAt, answers: [ { id: 'closing', choice: S.closing.choice, other: '', comment: S.closing.comment } ], reopen: [] };
  return { round: 3, submittedAt: S.submittedAt, answers: ROUND.questions.map(q => ({ id: q.id, ...ans(q.id) })), reopen: S.reopen };
}
function answersText() {
  if (S.scene === 'closing') return `Closing round: ${S.closing.choice === 'confirm' ? 'Confirm' : 'Not yet'}` + (S.closing.comment.trim() ? `\nWhat is missing: ${S.closing.comment.trim()}` : '');
  const lines = ['Round 3 answers'];
  for (const q of ROUND.questions) {
    lines.push(`${q.id}: ${answerLabel(q)}`);
    if (ans(q.id).comment.trim()) lines.push(`  comment: ${ans(q.id).comment.trim()}`);
  }
  if (S.reopen.length) lines.push(`Reopen: ${S.reopen.join(', ')}`);
  return lines.join('\n');
}

/* ---------------- shared fragments ---------------- */
function statusHTML() {
  const closing = S.scene === 'closing';
  switch (S.submit) {
    case 'sending': return `<div class="st st-sending" role="status"><span class="spin"></span>Saving your answers and waking Claude…</div>`;
    case 'sent': return `<div class="st st-ok" role="status"><span><b>${closing && S.closing.choice === 'confirm' ? 'Confirmed.' : 'Sent.'}</b> ${closing ? (S.closing.choice === 'confirm' ? 'Claude replied in the thread and is wrapping up the session.' : 'Claude is reading what is missing and will post another round here.') : 'Claude replied in the Submit thread and is writing round 4. It will appear on this page.'}</span></div>`;
    case 'saved': return `<div class="st st-warn" role="alert"><span><b>Saved, but Claude was not woken.</b> Type <code>submitted</code> in the terminal and the session reads your saved answers.</span><div class="st-row"><button class="btn btn-sm" data-act="retry">Try waking it again</button></div></div>`;
    case 'neither': return `<div class="st st-bad" role="alert"><span><b>Not saved and not sent.</b> Copy your answers and paste them into the terminal.</span><pre id="fallback-text">${esc(answersText())}</pre><div class="st-row"><button class="btn btn-sm accent" data-act="copy">Copy answers</button><button class="btn btn-sm" data-act="retry">Try again</button><span class="label" id="copied" role="status"></span></div></div>`;
    default: return '';
  }
}
function carriedNote(q) {
  const c = q.carriedFrom;
  if (!c) return '';
  if (c.reason === 'deferred') return `<p class="carried"><span class="tag park">Carried</span>You deferred this in round ${c.round} (${c.id}).</p>`;
  return `<p class="carried"><span class="tag park">Reopened</span>You reopened ${c.id}. Your earlier answer: <b>${md(c.earlier)}</b></p>`;
}
const fig = (svg, cap) => `<figure class="fig"><div class="fig-scroll">${svg}</div>${cap ? `<figcaption>${md(cap)}</figcaption>` : ''}</figure>`;
function docsBlock(list, label = 'Written to the repo') {
  return `<div class="docs"><span class="label">${label}</span>${list.length ? `<ul>${list.map(d => `<li><code>${esc(d.file)}</code> ${md(d.summary)}</li>`).join('')}</ul>` : `<p class="docs-none">Nothing new this round.</p>`}</div>`;
}
function reopenCtl(s) {
  const closing = S.scene === 'closing';
  if (s.reopened) return `<span class="tag park">${closing ? 'replaced by ' + s.replacedBy : 'reopened · back as ' + s.reopened}</span>`;
  if (s.carried) return `<span class="tag park">${closing ? 'settled as ' + s.replacedBy : 'carried · back as ' + s.carried}</span>`;
  if (closing) return '';
  const on = S.reopen.includes(s.id);
  return `${on ? '<span class="tag accent">back in round 4</span> ' : ''}<button class="btn-link" data-act="reopen" data-id="${s.id}" aria-pressed="${on}" ${dis()}>${on ? 'Undo' : 'Reopen'}</button>`;
}
function howSummary(r) {
  const n = k => r.settled.filter(s => s.how === k).length;
  const parts = [];
  if (n('rec')) parts.push(`${n('rec')} recommendation${n('rec') > 1 ? 's' : ''} taken`);
  if (n('yours')) parts.push(`${n('yours')} your pick`);
  if (n('other')) parts.push(`${n('other')} your own answer`);
  if (n('defer')) parts.push(`${n('defer')} deferred`);
  return parts.join(', ');
}
function closingCtl(p) {
  const c = S.closing;
  return `<div class="cl-ctl"><div class="cl-btns"><button class="btn accent" data-act="confirm" ${dis()}>Confirm</button><button class="btn ${c.choice === 'not-yet' ? 'on' : ''}" data-act="notyet" ${dis()}>Not yet</button></div>
    ${c.choice === 'not-yet' ? `<label class="cl-note" for="closing-${p}"><span class="label">What is missing or wrong?</span><textarea id="closing-${p}" data-field="closing" rows="3" ${dis()}>${esc(c.comment)}</textarea></label><div class="cl-btns"><button class="btn accent" data-act="close-send">Send to Claude</button></div>` : ''}
    ${statusHTML()}</div>`;
}
const otherInput = (p, q) => `<input type="text" id="other-${p}-${q.id}" data-field="other" data-q="${q.id}" value="${esc(ans(q.id).other)}" placeholder="Your answer" aria-label="Your answer for ${q.id}" ${dis()}>`;
const commentBox = (p, q) => `<textarea id="comment-${p}-${q.id}" data-field="comment" data-q="${q.id}" rows="2" placeholder="Qualify your choice, or leave empty" ${dis()}>${esc(ans(q.id).comment)}</textarea>`;
const sampleRow = () => `<span class="chip">SAMPLE DATA</span><span class="label">grill-with-artifact · 2026-09-30</span>`;

/* ---------------- A · Column ---------------- */
function viewA() {
  const closing = S.scene === 'closing';
  return `<div class="a-wrap">
    <header class="a-hdr"><div class="row">${sampleRow()}</div><h1>${TOPIC}</h1>
      <p class="a-lede">${closing ? 'Nothing is left open. Check the whole design below, then confirm it or say what is missing.' : 'Answer each question here and press Submit. Claude reads your answers, writes any docs they settle, and posts the next round on this page.'}</p></header>
    ${closing ? '' : fig(ROUND.treeSvg, ROUND.treeCaption) }
    ${rounds().map((r, i, all) => pastA(r, i === all.length - 1 && !closing)).join('')}
    ${closing ? closingA() : roundA()}
  </div>${closing ? '' : barA()}`;
}
function pastA(r, open) {
  return `<section class="a-round"><div class="a-rhead"><h2>Round ${r.round}</h2><span class="tag ok">settled · ${r.settled.length} of ${r.settled.length}</span></div>
    <details class="a-settled" ${open ? 'open' : ''}><summary>Your answers: ${howSummary(r)}</summary><ol>
    ${r.settled.map(s => `<li><span class="qid">${s.id}</span><span><b>${esc(s.title)}:</b> ${md(s.answer)}<span class="how">${HOW[s.how]}</span></span><span>${reopenCtl(s)}</span></li>`).join('')}
    </ol></details>${docsBlock(r.docsWritten)}</section>`;
}
function roundA() {
  return `<section class="a-round"><div class="a-rhead"><h2>Round 3</h2><span class="tag accent">open · ${ROUND.questions.length} questions</span><button class="btn-link" data-act="all" ${dis()}>Take all remaining recommendations</button></div>
    ${ROUND.questions.map(cardA).join('')}</section>`;
}
function cardA(q) {
  const a = ans(q.id);
  const radio = v => `<input type="radio" name="a-${q.id}" id="a-${q.id}-${v}" value="${v}" data-q="${q.id}" ${a.choice === v ? 'checked' : ''}>`;
  return `<article class="a-q" id="a-card-${q.id}" data-qstate="${q.id}">
    <div class="a-qhead"><span class="qid">${q.id}</span><h3>${esc(q.title)}</h3><span class="qtag" data-qstate="${q.id}" data-qtag></span></div>
    ${carriedNote(q)}
    ${q.figureSvg ? fig(q.figureSvg, q.figureCaption) : ''}
    <fieldset class="a-opts" ${dis()}><legend class="sr">Answer for ${q.id}</legend>
      ${q.options.map(o => `<label class="a-opt" for="a-${q.id}-${o.id}">${radio(o.id)}<span><span class="t">${o.id}. ${md(o.title)}${o.id === q.recommended ? '<span class="rec">Recommended</span>' : ''}</span><span class="d">${md(o.detail)}</span></span></label>`).join('')}
      <label class="a-opt" for="a-${q.id}-other">${radio('other')}<span><span class="t">Other</span>${a.choice === 'other' ? otherInput('a', q) : '<span class="d">Give an answer none of these covers.</span>'}</span></label>
      <label class="a-opt a-defer" for="a-${q.id}-defer">${radio('defer')}<span><span class="t">Defer</span><span class="d">Park it. It comes back in round 4.</span></span></label>
    </fieldset>
    <div class="a-why"><span class="label">Why ${q.recommended}</span><p>${md(q.why)}</p></div>
    <div class="a-foot"><label class="a-comment" for="comment-a-${q.id}"><span class="label">Comment (optional)</span>${commentBox('a', q)}</label>
      <button class="btn btn-sm" data-act="rec" data-q="${q.id}" ${dis()}>Take recommendation (${q.recommended})</button></div>
  </article>`;
}
function barA() {
  return `<div class="a-bar"><div class="a-bar-in">
    <span class="a-count"><b data-ready></b> of ${ROUND.questions.length} ready${S.reopen.length ? ` · ${S.reopen.length} to reopen` : ''}</span>
    <div class="a-actions"><button class="btn" data-act="all" ${dis()}>Take all remaining</button><button class="btn accent" data-act="submit">Submit round 3</button></div>
    ${statusHTML()}</div></div>`;
}
function closingA() {
  return `<section class="a-round"><div class="a-rhead"><h2>What we settled</h2><span class="tag ok">3 rounds · ${active().length} decisions</span></div>
    <div class="a-summary">${CLOSING.summary.map(s => `<h3>${esc(s.heading)}</h3><p>${md(s.text)}</p>`).join('')}</div>
    <div class="a-summary"><h3>Is this the whole design?</h3><p>Confirm ends the session. Not yet sends Claude what is missing, and it posts another round.</p>${closingCtl('a')}</div></section>`;
}

/* ---------------- render + events ---------------- */
function render() {
  const f = document.activeElement, fid = f && f.id;
  const sel = f && typeof f.selectionStart === 'number' ? [f.selectionStart, f.selectionEnd] : null;
  const d = DIRS.find(x => x.k === S.dir);
  $('#stage').innerHTML = `<div class="dir glass pal-${d.k}">${viewA()}</div>`;
  $('#p-dir').textContent = `${DIRS.indexOf(d) + 1} · ${d.name}`;
  refresh();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(...sel); } catch (e) {} } }
}
function refresh() {
  document.querySelectorAll('[data-qstate]').forEach(el => { el.dataset.state = qstate(QS[el.dataset.qstate]); });
  document.querySelectorAll('[data-qtag]').forEach(el => { el.textContent = QTAG[el.dataset.state]; });
  document.querySelectorAll('[data-ready]').forEach(el => { el.textContent = readyN(); });
  document.querySelectorAll('[data-act="submit"]').forEach(b => { b.disabled = !allDone() || locked(); });
  document.querySelectorAll('[data-act="close-send"]').forEach(b => { b.disabled = !S.closing.comment.trim() || locked(); });
  const ft = $('#fallback-text'); if (ft) ft.textContent = answersText();
  const p = $('#p-panel');
  if (!p.hidden) p.innerHTML = `<h4>${S.scene === 'closing' ? 'answers/round-4' : 'answers/round-3'}: what Submit writes</h4><pre>${esc(JSON.stringify(answersDoc(), null, 2))}</pre>
    <h4>Figure style contract</h4><pre>Claude's SVGs use only these classes; the page colours them from its tokens.
n-settled  n-open  n-blocked  n-deferred   on the &lt;g&gt; around a node's &lt;rect&gt; and &lt;text&gt;
edge   edge hot                            on a &lt;path&gt; or &lt;line&gt;
box    box hot                             on the &lt;g&gt; around a &lt;rect&gt; and &lt;text&gt;
lbl                                        on a &lt;text&gt;: small mono label
No fill or stroke colours inside a figure. Plain text and strokes use currentColor.
Optional: data-q="Q1" on a node's &lt;g&gt; links it to that question.</pre>`;
}
function pick(q, o) { if (locked()) return; ans(q).choice = o; render(); if (o === 'other') document.getElementById(`other-a-${q}`)?.focus(); }
function send() {
  S.submit = 'sending'; S.submittedAt = new Date().toISOString(); render();
  setTimeout(() => { S.submit = S.outcome; render(); }, 1100);
}
function jump(q) {
  document.getElementById(`a-card-${q}`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
const ACTS = {
  pick: d => pick(d.q, d.o),
  rec: d => pick(d.q, QS[d.q].recommended),
  defer: d => pick(d.q, ans(d.q).choice === 'defer' ? null : 'defer'),
  all: () => { if (locked()) return; ROUND.questions.forEach(q => { if (!ans(q.id).choice) ans(q.id).choice = q.recommended; }); render(); },
  reopen: d => { if (locked()) return; S.reopen = S.reopen.includes(d.id) ? S.reopen.filter(x => x !== d.id) : [...S.reopen, d.id]; render(); },
  submit: () => { if (allDone() && !locked()) send(); },
  retry: () => send(),
  copy: () => {
    const text = answersText(), note = t => { const c = $('#copied'); if (c) c.textContent = t; };
    const selectIt = () => { const r = document.createRange(); r.selectNodeContents($('#fallback-text')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); note('Selected: press Ctrl+C or Cmd+C'); };
    try { navigator.clipboard.writeText(text).then(() => note('Copied'), selectIt); } catch (e) { selectIt(); }
  },
  confirm: () => { if (locked()) return; S.closing.choice = 'confirm'; send(); },
  notyet: () => { if (locked()) return; S.closing.choice = 'not-yet'; render(); document.getElementById('closing-a')?.focus(); },
  'close-send': () => { if (S.closing.comment.trim() && !locked()) send(); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && !t.disabled) { ACTS[t.dataset.act]?.(t.dataset); return; }
  const node = e.target.closest('svg [data-q]');
  if (node) jump(node.dataset.q);
});
document.addEventListener('change', e => { const t = e.target; if (t.matches('input[type="radio"][data-q]')) pick(t.dataset.q, t.value); });
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.field;
  if (!f) return;
  if (f === 'closing') S.closing.comment = t.value; else ans(t.dataset.q)[f] = t.value;
  refresh();
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); cycle(e.key === 'ArrowRight' ? 1 : -1); return; }
});

/* prototype bar */
function cycle(dx) { const i = DIRS.findIndex(x => x.k === S.dir); setDir(DIRS[(i + dx + DIRS.length) % DIRS.length].k); }
function setDir(k) { S.dir = k; try { history.replaceState(null, '', '#' + k); } catch (e) {} render(); }
$('#p-prev').onclick = () => cycle(-1);
$('#p-next').onclick = () => cycle(1);
$('#p-scene').onchange = e => { S.scene = e.target.value; reset(); render(); };
$('#p-outcome').onchange = e => { S.outcome = e.target.value; };
$('#p-theme').onchange = e => { document.documentElement.dataset.theme = e.target.value; };
$('#p-width').onchange = e => { document.body.classList.toggle('frame', e.target.value === 'phone'); };
$('#p-data').onclick = () => { const p = $('#p-panel'); p.hidden = !p.hidden; $('#p-data').setAttribute('aria-expanded', String(!p.hidden)); refresh(); };
$('#p-reset').onclick = () => { reset(); render(); };
new ResizeObserver(([en]) => document.documentElement.style.setProperty('--proto-h', Math.ceil(en.target.getBoundingClientRect().height) + 'px')).observe($('#proto'));
$('#p-theme').value = document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
const fromHash = () => { const h = (location.hash || '').slice(1); if (DIRS.some(x => x.k === h)) S.dir = h; };
fromHash();
addEventListener('hashchange', () => { fromHash(); render(); });
render();
</script>
