# The daily upstream-drift check: update-skills' heads and plan, run with no
# model, file the source repo's drift issue or rewrite its `## Drift` table
# when an upstream skill moved, and mention the owner on every such write. A
# day with nothing new writes nothing. The owner then runs /ship on the issue,
# which moves the pins by update-skills' "In a Ship run".
name: upstream-drift

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [feat/upstream-drift-check-533]

permissions:
  contents: read
  issues: write

# GitHub lists a just-filed issue a few seconds late, so two overlapping runs
# could each file one.
concurrency:
  group: upstream-drift

jobs:
  drift:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Anonymous GitHub API reads hit the rate limit and come back as
      # `unreachable` rows, so heads gets the token. heads exits 0 with some
      # rows unreachable: the summary names them. It exits 1 when every read
      # failed, which fails the job. Drift itself never does.
      # The issue's labels are only ever set when it is filed: a
      # `ready-for-human` on it is the owner's, after a run held a pin back.
      - name: File or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          U=skills/update-skills/scripts S=skills/ship/scripts t=$RUNNER_TEMP
          title='Upstream drift: composed skills'
          rc=0
          "$U/heads.sh" . > "$t/heads.json" || rc=$?
          jq -r '.unreachable[]? | "- drift not checked: \(.skill): \(.error)"' "$t/heads.json" >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || exit "$rc"
          "$U/plan.sh" . "$t/heads.json" > "$t/plan.json"
          n=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number")
          n=${n%%$'\n'*}
          if [ -n "$n" ]; then
            gh api "repos/$REPO/issues/$n" --jq .body > "$t/current.md"
            "$U/drift-body.sh" "$t/plan.json" --current "$t/current.md" > "$t/drift.json"
          else
            "$U/drift-body.sh" "$t/plan.json" > "$t/drift.json"
          fi
          if [ "$(jq .rows "$t/drift.json")" -eq 0 ]; then
            echo "No upstream drift." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          jq -r .table "$t/drift.json" > "$t/table.md"
          if [ -z "$n" ]; then
            { printf '## Drift\n\n'; cat "$t/table.md"; printf '\n## Moving the pins\n\n'
              echo "A Ship run moves these pins by the \"In a Ship run\" section of update-skills' SKILL.md."
            } > "$t/body.md"
            url=$(gh issue create --repo "$REPO" --title "$title" --body-file "$t/body.md" \
              --label ready-for-agent --label enhancement --label XS --label low)
            n=${url##*/}
            echo "Filed $url." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$(jq .changed "$t/drift.json")" = true ]; then
            "$S/update-issue-body.sh" "$n" --section Drift --body-file "$t/table.md"
            echo "Rewrote the drift table of #$n." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "#$n already lists this drift: nothing written." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          # shellcheck disable=SC2016  # the backticks are Markdown code spans
          printf '@%s upstream drift changed: the `## Drift` table above lists what moved. `/ship %s` moves the pins.\n' \
            "$OWNER" "$n" > "$t/note.md"
          "$S/comment-issue.sh" "$n" --body-file "$t/note.md"
