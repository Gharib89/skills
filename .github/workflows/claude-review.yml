name: Claude PR Review

# The `claude` reviewer in docs/agents/ship.md: Copilot's fallback, driven only
# when Copilot exits degraded. An issue-comment trigger and nothing else, which
# is what `Request: comment @claude` in the profile asks for. There is
# deliberately no `pull_request` trigger: a check run on the PR head would make
# this a CI leg, and `## CI` says this repo has none.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    # An issue_comment fires on issues too, so the PR test comes first. A run
    # that starts and finds nothing to review still costs minutes and still
    # shows up in the Actions tab as a review that happened. Deliberately no
    # commenter test: the unattended lane posts the mention under its own
    # identity, and an `if:` that declines it costs the round. Ship grades that
    # `never-queued`, so the loss is named rather than silent; naming it is not
    # reviewing the PR, which is what ADR 0002 keeps this reviewer for.
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    # Claude Code resolves no account identity from a setup token, so every
    # metric this runner exports reaches cc-otel with a NULL user_email and
    # lands there as unattributed telemetry (58 such sessions in the 21 days to
    # 2026-09-21). The CLI takes env-supplied OTel resource attributes whole
    # while it has no identity of its own, and strips every user.* and
    # identity.* key once it has one, so this attributes the runs and cannot
    # override a real seat's email. It has to sit at job level: the action
    # forwards OTEL_RESOURCE_ATTRIBUTES explicitly to the CLI subprocess, and
    # its own step env: block shadows anything set further out.
    env:
      OTEL_RESOURCE_ATTRIBUTES: user.email=ahmed.gharib@itworx.com
    steps:
      # Not optional: the action runs `git diff ... HEAD` in the workspace
      # before the prompt runs, and fails the whole job with "Not a git
      # repository" when there is nothing checked out (run 34847733490, the
      # round PR #168 requested). An issue_comment checkout is the default
      # branch rather than the PR head, and that is the brief to review
      # against: the canonical one, not the version the PR under review
      # proposes. The PR head is not checked out; the reviewed diff comes from
      # `gh pr diff`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            You are reviewing this pull request.

            1. Read `.github/copilot-instructions.md` with the Read tool. It is your
               brief: it names the coding standards to review against and the things
               that are not findings in this repo. Read the standards file it points
               at as well.
            2. Run `gh pr view ${{ github.event.issue.number }} --json title,body` and
               find the linked issue (Closes/Fixes/Resolves #N). If one exists, run
               `gh issue view N` and treat it as the spec for this change.
            3. Run `gh pr diff ${{ github.event.issue.number }}` once and review
               only the changed lines it returned, against (a) the brief and the
               standards it names and (b) the linked issue. Walking the changed
               files one at a time instead spends the turn budget on navigation
               and the round dies before it posts.

            Report the round as ONE formal pull request review, submitted in a
            single call, with every inline finding attached to it. Build it as one
            command beginning with `gh api`, the JSON arriving by heredoc:

                gh api --method POST \
                  repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/reviews \
                  --input - <<'JSON'
                {"event": "COMMENT",
                 "body": "<the round's text, or exactly `no findings`>",
                 "comments": [{"path": "<file>", "line": <line in the new file>,
                               "side": "RIGHT", "body": "<one finding>"}]}
                JSON

            No other shape of that call works. `--allowedTools` below grants
            `Bash(gh api:*)`, which matches a command that starts with `gh api`
            and nothing else. Piping from `echo` makes `echo` the command, the
            call is refused, and a refused call is a round that stops before
            the PR.

            One entry in `comments` per finding tied to a line, each naming the rule
            or issue requirement broken and the concrete fix. A finding you cannot
            anchor to a line in the diff goes in `body` rather than `comments`:
            GitHub rejects the entire call when one `comments` entry names a line
            outside the diff, and a rejected call is a round the run cannot see.

            Submit exactly one review, even when you found nothing: a fallback
            reviewer that stays silent on a clean PR cannot be told apart from one
            that failed, and the run waits out its whole poll window either way. With
            nothing actionable, send `body` of exactly `no findings` and an empty
            `comments` list. Open `body` with the findings: the run reads its
            first 2000 characters, and a summary of the diff or praise ahead of
            them pushes them past that cut.
          claude_args: |
            --model opus
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(gh api:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"

      # A failed round otherwise leaves nothing on the PR: no review, no comment.
      # Ship grades it from the run read either way: the profile block driving
      # this workflow carries `Workflow:`, so `poll-pr --await-run` reads the
      # failed run itself as `infra-error`. The step is what puts the run URL on
      # the PR, with the failure subtype beside it where the action left one and
      # `unknown` where it did not, so the human reading the PR has the reason or
      # the link that carries it. Costs one comment per failed round.
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -uo pipefail
          reason=unknown
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            reason="$(jq -rs 'flatten | map(select(.type == "result")) | last
                              | .subtype // ""' "$EXECUTION_FILE" 2>/dev/null || echo "")"
          fi
          reason=$(printf '%s\n' "$reason" | head -n 1)
          case $reason in ''|success) reason=unknown ;; esac
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body="The Claude review job failed: \`$reason\`. Check the PR for a review from this round before reading the reviewer as silent. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
