name: semantic-release

# One release run per skill on every push to main. python-semantic-release reads
# the Conventional-Commit type of the squash subject, which is the PR title the
# `bump-guard` workflow validated and `merge.sh` passes as `commit_title`, then
# writes that skill's `metadata.version`, cuts its `CHANGELOG.md`, refreshes its
# derived copy under `.claude/skills/`, commits and tags. A PR no longer touches
# the version line, so two PRs on one skill merge in either order.
# See docs/adr/0003-version-and-changelog-cut-on-merge.md.
#
# The CLI rather than python-semantic-release's own action: that action runs in a
# `python:slim` container carrying no node, and every configuration's build
# command runs this repo's `npx skills add` refresh line so `.claude/skills/`
# follows the bump and the `derived-copies` gate stays green on main.
#
# The default GITHUB_TOKEN rather than a PAT: a push made with it starts no
# workflow run, which is what keeps the release commit from re-triggering this.
# The job's `if` is the second guard, for a release commit pushed by hand.

on:
  push:
    branches:
      - main

permissions:
  contents: write

# One release at a time, queued rather than cancelled: two merges landing close
# together each cut their own tag, and cancelling the first would drop one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    env:
      # The skills this repo releases, named once for both loops below.
      SKILLS: ship cloud-ship setup-skills
    steps:
      # The whole history: each skill's version comes from the commits since that
      # skill's own last tag, and a shallow clone carries neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # Checking out the branch name can land a tip newer than the commit that
      # triggered this run; the release must describe that commit.
      - name: Force the branch to the commit that triggered this run
        run: git reset --hard ${{ github.sha }}

      # A skill with no tag matching its `tag_format` makes python-semantic-release
      # ignore the version in `SKILL.md` and force 1.0.0, which would regress
      # `ship` from 7.x on the first run. The baseline tags are pushed once, before
      # this workflow first fires; refuse to release rather than cut that version.
      - name: Refuse to release without the baseline tags
        run: |
          for s in $SKILLS; do
            git tag -l "$s-v*" | grep -q . \
              || { echo "no $s-v* tag: push one at the version in skills/$s/SKILL.md before merging"; exit 1; }
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install python-semantic-release
        run: pip install python-semantic-release==10.6.2

      - name: Configure the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Sequential, because each release pushes. A skill untouched by the commits
      # since its own tag reports that and cuts nothing, so a push touching one
      # skill cuts one tag and a push touching none cuts none.
      - name: Release each skill
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for s in $SKILLS; do
            echo "::group::$s"
            semantic-release -c ".release/$s.toml" version --no-vcs-release
            echo "::endgroup::"
          done
