# TEMPORARY. Two questions #174 cannot answer from a diff, both about what
# GitHub Actions actually does. Deleted in the next commit on this branch.
name: scope-probe

on: pull_request

permissions: {}

jobs:
  # Q1: does POST /repos/{o}/{r}/issues/{n}/comments work on a pull request
  # with `pull-requests: write` and no `issues` scope at all?
  pr_comment_scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="scope-probe: POST /issues/{n}/comments succeeded with \`pull-requests: write\` and no \`issues\` scope."

  # Q2: are a job's outputs still readable by a dependent job when the emitting
  # job failed after setting them?
  emit:
    runs-on: ubuntu-latest
    outputs:
      reason: ${{ steps.s.outputs.reason }}
    steps:
      - id: s
        run: echo "reason=error_max_turns" >> "$GITHUB_OUTPUT"
      - run: exit 1

  read_output:
    needs: emit
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -uo pipefail
          echo "needs.emit.result=${{ needs.emit.result }}"
          test "${{ needs.emit.outputs.reason }}" = "error_max_turns"
